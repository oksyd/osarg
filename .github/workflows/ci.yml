name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-26.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: Cache cargo artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-

      - name: Format check
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Size gate
        env:
          MAX_OSARG_DELTA_BYTES: "8192"
          MAX_OSARG_RATIO: "1.05"
          MIN_CLAP_DELTA_BYTES: "65536"
        run: bash ./scripts/size-bench.sh

      - name: Package check
        run: cargo package
